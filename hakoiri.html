<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>箱入り娘：エディタ + 最短手アニメ（シンプル版）</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f6f6f6; }
  .toolbar { margin: 10px auto; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .pill { padding: 6px 10px; border-radius: 999px; border: 1px solid #ddd; background:#fff; }
  canvas { background:#fff; border:2px solid #333; margin-top: 10px; }
  #status { margin: 8px 0; color:#333; }
  .note { color:#666; font-size: 12px; }
</style>
</head>
<body>
<h2>箱入り娘 – 盤面エディタ + 解法アニメ</h2>

<div class="toolbar">
  <span class="pill"><b>ブロック：</b>
    <button data-type="t">赤(2×2)</button>
    <button data-type="v">縦2(1×2)</button>
    <button data-type="h">横2(2×1)</button>
    <button data-type="s">小(1×1)</button>
    <button data-type="eraser">消しゴム</button>
  </span>
  <span class="pill">
    <button id="clearBtn">全消去</button>
  </span>
</div>

<canvas id="board" width="240" height="300"></canvas>
<div id="status">盤面を作成して「解く」を押してください。</div>

<div class="toolbar">
  <button id="solveBtn">解く（最短手）</button>
  <button id="playBtn" disabled>▶ 再生</button>
  <button id="pauseBtn" disabled>⏸ 一時停止</button>
  <button id="prevBtn" disabled>← 1手戻る</button>
  <button id="nextBtn" disabled>→ 1手進む</button>
  <button id="resetBtn">初期に戻す</button>
</div>

<script>
/* ===== 盤パラメータ ===== */
const COLS = 4, ROWS = 5, SIZE = 60;     // 4×5
const SPEED_MS = 500;                    // 0.5秒/手
const EXIT_POS = { x:1, y:ROWS-2 };      // (1,3) 到達でクリア

/* ===== DOM ===== */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const solveBtn = document.getElementById('solveBtn');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const clearBtn = document.getElementById('clearBtn');

/* ===== エディタ：type 定義 ===== */
/* 小(1×1) は見やすい黄色（×は描かない） */
const TYPE_SPEC = {
  t: { w:2, h:2, color:'#e23c3c' },       // 赤
  v: { w:1, h:2, color:'#8b8f97' },       // 縦2
  h: { w:2, h:1, color:'#80bfff' },       // 横2
  s: { w:1, h:1, color:'#ffc400' }        // 小（高コントラスト黄）
};

let selected = 't';
let initialBlocks = [];
let blocks = []; // {type,x,y,w,h,color}

/* ===== ブロック選択 ===== */
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.onclick = () => { selected = btn.dataset.type; };
});

/* ===== 描画 ===== */
function draw(state = blocks) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // グリッド
  ctx.strokeStyle = '#ddd';
  for (let x=0; x<=COLS; x++) { ctx.beginPath(); ctx.moveTo(x*SIZE,0); ctx.lineTo(x*SIZE,ROWS*SIZE); ctx.stroke(); }
  for (let y=0; y<=ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*SIZE); ctx.lineTo(COLS*SIZE,y*SIZE); ctx.stroke(); }

  // 出口の目印（下端にバー）
  ctx.fillStyle = 'pink';
  ctx.fillRect(1*SIZE, ROWS*SIZE-10, 2*SIZE, 10);

  // ブロック
  for (const b of state) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x*SIZE, b.y*SIZE, b.w*SIZE, b.h*SIZE);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x*SIZE, b.y*SIZE, b.w*SIZE, b.h*SIZE);
  }
}

/* ===== 盤面編集 ===== */
function cellFromMouse(ev) {
  const r = canvas.getBoundingClientRect();
  return {
    cx: Math.floor((ev.clientX - r.left) / SIZE),
    cy: Math.floor((ev.clientY - r.top) / SIZE),
  };
}
function overlaps(a,b) {
  return !(a.x+a.w<=b.x || b.x+b.w<=a.x || a.y+a.h<=b.y || b.y+b.h<=a.y);
}
function place(type, x, y) {
  if (type === 't' && blocks.some(b => b.type === 't')) {
    statusEl.textContent = '赤(2×2) は1つだけ配置できます。';
    return;
  }
  const spec = TYPE_SPEC[type];
  const cand = { type, x, y, w: spec.w, h: spec.h, color: spec.color };
  // 盤内 & 衝突チェック
  if (cand.x < 0 || cand.y < 0 || cand.x + cand.w > COLS || cand.y + cand.h > ROWS) return;
  for (const o of blocks) if (overlaps(cand, o)) return;
  blocks.push(cand);
}
canvas.addEventListener('click', (ev) => {
  const {cx, cy} = cellFromMouse(ev);
  if (selected === 'eraser') {
    blocks = blocks.filter(b => !(cx>=b.x && cx<b.x+b.w && cy>=b.y && cy<b.y+b.h));
  } else {
    place(selected, cx, cy);
  }
  draw();
  statusEl.textContent = '編集中: ブロックを配置して「解く」を押してください。';
});

/* ===== 全消去 / 初期保存・復元 ===== */
clearBtn.onclick = () => { blocks = []; draw(); statusEl.textContent = '盤面を全消去しました。'; };
resetBtn.onclick = () => { blocks = JSON.parse(JSON.stringify(initialBlocks)); draw(); statusEl.textContent = '初期配置に戻しました。'; };

/* ===== 解法（BFS 最短手） ===== */
function canonicalKey(state) {
  const arr = state.map(b => ({type:b.type, x:b.x, y:b.y, w:b.w, h:b.h}));
  arr.sort((A,B) =>
    A.type.localeCompare(B.type) ||
    A.w - B.w || A.h - B.h ||
    A.x - B.x || A.y - B.y
  );
  return arr.map(b => `${b.type}:${b.w}x${b.h}@${b.x},${b.y}`).join('|');
}
function clone(state){ return state.map(b => ({...b})); }
function canMove(block, dx, dy, state) {
  const nx = block.x + dx, ny = block.y + dy;
  // 全ブロック盤外禁止
  if (nx < 0 || ny < 0 || nx + block.w > COLS || ny + block.h > ROWS) return false;
  const moved = { ...block, x:nx, y:ny };
  for (const o of state) { if (o !== block && overlaps(moved, o)) return false; }
  return true;
}
function isGoal(state){
  const t = state.find(b => b.type === 't');
  return !!t && t.x === EXIT_POS.x && t.y === EXIT_POS.y; // (1,3) 到達でクリア
}
function neighbors(state) {
  const outs = [];
  for (let i=0; i<state.length; i++) {
    const b = state[i];
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      if (canMove(b,dx,dy,state)) {
        const ns = clone(state);
        ns[i].x += dx; ns[i].y += dy;
        outs.push(ns);
      }
    }
  }
  return outs;
}
function bfsSolve(initial) {
  const start = clone(initial);
  if (!start.some(b => b.type === 't')) return null; // 赤が無い
  const q = [ start ];
  const visited = new Set([ canonicalKey(start) ]);
  const parent = new Map();
  const byKey = new Map();
  byKey.set(canonicalKey(start), start);

  while (q.length) {
    const s = q.shift();
    const k = canonicalKey(s);
    if (isGoal(s)) {
      const path = [s];
      let cur = k;
      while (parent.has(cur)) { const prev = parent.get(cur); path.push(byKey.get(prev)); cur = prev; }
      path.reverse();
      return path;
    }
    for (const ns of neighbors(s)) {
      const nk = canonicalKey(ns);
      if (!visited.has(nk)) {
        visited.add(nk);
        parent.set(nk, k);
        byKey.set(nk, ns);
        q.push(ns);
      }
    }
  }
  return null;
}

/* ===== 再生コントロール ===== */
let solution = null; // 状態配列（初期を含む）
let curIndex = 0;
let timer = null;
function setButtonsPlayable(on) {
  playBtn.disabled = !on; pauseBtn.disabled = !on; prevBtn.disabled = !on; nextBtn.disabled = !on;
}
function showIndex(i) {
  if (!solution) return;
  curIndex = Math.max(0, Math.min(solution.length - 1, i));
  draw(solution[curIndex]);
  statusEl.textContent = (curIndex === solution.length-1)
    ? `クリア！ 最短手数：${solution.length-1}`
    : `手順 ${curIndex}/${solution.length-1}`;
}
function play() {
  if (!solution) return;
  clearInterval(timer);
  timer = setInterval(() => {
    if (curIndex >= solution.length - 1) { clearInterval(timer); return; }
    showIndex(curIndex + 1);
  }, SPEED_MS);
}
function pause() { clearInterval(timer); }
prevBtn.onclick = () => { pause(); showIndex(curIndex - 1); };
nextBtn.onclick = () => { pause(); showIndex(curIndex + 1); };
playBtn.onclick = () => { play(); };
pauseBtn.onclick = () => { pause(); };

/* ===== 解く ===== */
solveBtn.onclick = () => {
  pause();
  initialBlocks = JSON.parse(JSON.stringify(blocks)); // リセット用
  statusEl.textContent = '探索中…（最短手を計算）';
  setButtonsPlayable(false);

  const path = bfsSolve(blocks);
  if (!path) { statusEl.textContent = '解が見つかりませんでした（配置を確認してください）'; solution = null; return; }

  solution = path;
  curIndex = 0;
  draw(solution[0]);
  statusEl.textContent = `最短手数：${solution.length-1}（▶で再生、←/→で1手移動）`;
  setButtonsPlayable(true);
};

window.addEventListener('load', () => { draw(); });
</script>

<hr>
<div style="text-align:center; margin-top:30px;">
  <a href="hakoiri-guide.html" style="font-size:16px; color:#0066cc;">
    → 箱入り娘の解き方・攻略を見る
  </a>
</div>

</body>
</html>
